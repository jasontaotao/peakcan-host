# 吉利商用车 CAN 网络管理需求规范 V2.0（2025-02-27）。
standard:
  id: geely-cv
  version: "2.0"
  vendor: Geely Commercial Vehicle
  extends: autosar-cannm@4.1.3
  source:
    doc: 吉利商用车CAN网络管理需求规范_V2.0
    revision: "2.0"

overrides:
  timings:
    cycle_ms: 500
    # T_NM_TIMEOUT = 2000ms ±10%（spec §2.4 / 吉利 §5.5）。与 base 相同，显式写出便于核对。
    timeout_ms: 2000
    repeat_message_with_burst_ms: 1700
    repeat_message_without_burst_ms: 1500
    immediate_cycle_ms: 20
    immediate_count: 10
    tolerance_ratio: 0.1
  layout:
    nid_byte: 0
    cbv_byte: 1
    user_data_offset: 4
    user_data_length: 4
    bit_roles:
      # 吉利 §5.4.3 无 PNI：删除 base 的 bit6 声明。
      - byte: 3
        bit: 0
        name: NmSts
        meaning: "0=Repeat Message State, 1=Normal Operation State"
        constraint: none
      # 吉利 §5.4.3 / §5.4.4：CBV bit1–3、bit5–7 与 NMSts 所在字节的 bit1–7 均为预留，
      # 必须填 0。base 只声明了 bit0/bit4/bit6，剩下的位若不显式声明，
      # 对应规则在求值期找不到角色 → 进 Unmodeled，等于从未检查过。
      - { byte: 1, bit: 1, name: Reserved_B1_1, constraint: must_be_zero }
      - { byte: 1, bit: 2, name: Reserved_B1_2, constraint: must_be_zero }
      - { byte: 1, bit: 3, name: Reserved_B1_3, constraint: must_be_zero }
      - { byte: 1, bit: 5, name: Reserved_B1_5, constraint: must_be_zero }
      - { byte: 1, bit: 7, name: Reserved_B1_7, constraint: must_be_zero }
      - { byte: 3, bit: 1, name: Reserved_B3_1, constraint: must_be_zero }
      - { byte: 3, bit: 2, name: Reserved_B3_2, constraint: must_be_zero }
      - { byte: 3, bit: 3, name: Reserved_B3_3, constraint: must_be_zero }
      - { byte: 3, bit: 4, name: Reserved_B3_4, constraint: must_be_zero }
      - { byte: 3, bit: 5, name: Reserved_B3_5, constraint: must_be_zero }
      - { byte: 3, bit: 6, name: Reserved_B3_6, constraint: must_be_zero }
      - { byte: 3, bit: 7, name: Reserved_B3_7, constraint: must_be_zero }
  features:
    pn_enabled: false
  remove:
    - bit_roles[1.6]

rules:
  - id: NM_NID_MAPPING
    requirement: NM 报文 ECU 地址（NID）应与 CAN ID 低字节一致（扩展帧）
    declared_phase: normal
    observability: observed
    clauses: ["§5.4.2"]
    when:
      kind: nid_id_mapping
    expect:
      kind: matches_id_low_byte
    finding: NM_NID_MISMATCH
    source_ref: §5.4.2

  - id: NM_RMR
    requirement: 预留位必须为 0
    declared_phase: normal
    observability: observed
    clauses: ["§5.4.3"]
    when:
      kind: bit_rule
      role: RepeatMessageRequest
    expect:
      kind: is_zero
    finding: NM_RMR_SET_WHILE_DISABLED
    source_ref: §5.4.3

  # 吉利 §5.5 的 T_REPEAT_MESSAGE 是**两个**执行区间，不是单一 1600±10%：
  #   含快发 1700±60ms = 1640–1760；不含快发 1500±60ms = 1440–1560。
  # 必须拆成两条规则。若合成一条用并集 1440–1760，「无快发的 1700ms」与
  # 「有快发的 1500ms」都会被放过——那正是双区间存在的意义。
  #
  # with_burst 是**选窗器**不是形态断言：它决定这一段该用哪个区间判时长。
  # 形态不符时本条规则跳过并产 repeat_message_duration_not_applicable 观测，
  # 由另一条规则（或 burst_shape NM_BURST_SHAPE）负责。快发帧数/间隔的合规性见下方 NM_BURST_SHAPE。
  - id: NM_RMS_DURATION_BURST
    requirement: Repeat Message State（含快发）持续 1700±60ms
    declared_phase: wakeup
    observability: partial
    clauses: ["§5.5"]
    when:
      kind: repeat_message_duration
      cycle_ms: 500
    expect:
      kind: duration_within_ms
      min_ms: 1640
      max_ms: 1760
      anchor: nmsts
      with_burst: true
    finding: NM_REPEAT_MESSAGE_DURATION_EXCEEDED
    source_ref: §5.5

  - id: NM_RMS_DURATION_NOBURST
    requirement: Repeat Message State（不含快发）持续 1500±60ms
    declared_phase: wakeup
    observability: partial
    clauses: ["§5.5"]
    when:
      kind: repeat_message_duration
      cycle_ms: 500
    expect:
      kind: duration_within_ms
      min_ms: 1440
      max_ms: 1560
      anchor: nmsts
      with_burst: false
    finding: NM_REPEAT_MESSAGE_DURATION_EXCEEDED
    source_ref: §5.5

  # 吉利 §5.5：快发 10 帧 × 20ms ±10%（N_ImmediateNM_TIMES / T_NM_ImmediateCycleTime）。
  # 没有这条规则时，一个「快发帧数错误」的节点只要 RMS 总时长落在允许窗内就能全绿，
  # 报告也不会披露快发形态根本没查——这是审核发现的静默覆盖缺口。
  - id: NM_BURST_SHAPE
    requirement: 主动/本地唤醒后快发 10 帧，间隔 20ms ±10%
    declared_phase: wakeup
    observability: partial
    clauses: ["NM_03", "NM_04", "NM_16"]
    when:
      kind: burst_shape
      cycle_ms: 500
    expect:
      kind: count_equals
      count: 10
      interval_ms: 20
      pct: 0.1
    finding: NM_WAKEUP_BURST_MISMATCH
    source_ref: §5.5

  # 吉利 §5.3.2：睡眠/预睡眠状态下被远程唤醒后，应以正常周期恢复发送。
  # v1 的 normal_resume_shape 只判发送节奏，无法区分唤醒源：
  # NM_02/NM_15 是「远程唤醒 → 正常周期」，NM_03/NM_16 是「本地唤醒 → 快发」。
  # 真实数据里静默后快发是 NM_03/16 的合规形态，启用为 partial 会在 §14.6 形态上误报。
  # 因此标 unobservable：报告显式列出「未建模」，而不是静默消失，也不是误报。
  # 待 bit_rule is_one + wakeup 作用域落地后，**同时**把下面三项改掉：
  #   observability: partial
  #   expect: { kind: equals }
  #   finding: NM_NORMAL_RESUME_SHAPE_MISMATCH
  # 三者缺一，规则会静默失效（expect 不匹配时原语直接进 Unmodeled，永不产 finding）。
  - id: NM_RESUME_TO_RMS
    requirement: 静默唤醒后以 T_NM_MessageCycle 正常周期恢复发送（NM_02 / NM_15）
    declared_phase: wakeup
    observability: unobservable
    clauses: ["NM_02", "NM_15"]
    when: { kind: normal_resume_shape, min_silence_ms: 2000, cycle_ms: 500, pct: 0.1, min_frames: 4 }
    expect: { kind: observe }
    finding: ""
    source_ref: §5.3.2

  - id: NM_STOP_SENDING
    requirement: 进入 Ready Sleep State 后停止发送 NM 报文
    declared_phase: sleep
    observability: partial
    clauses: ["NM_09", "NM_12"]
    when:
      kind: stop_sending
    expect:
      kind: observe
    finding: ""
    source_ref: §5.3.3

  # 吉利 §5.4.3：CBV bit1–3、bit5–7 为预留位，必须填 0。
  # 逐位声明而不是「整字节等于 0」：bit0 是 RMR、bit4 是 AWB，整字节判定会把
  # 合法的 AWB=1 也报成预留位违规。
  - id: NM_RESERVED_B1_1
    requirement: CBV byte1.bit1 为预留位，必须填 0
    declared_phase: normal
    observability: observed
    clauses: ["§5.4.3"]
    when: { kind: bit_rule, byte: 1, bit: 1 }
    expect: { kind: is_zero }
    finding: NM_RESERVED_BIT_SET
    source_ref: §5.4.3

  - id: NM_RESERVED_B1_2
    requirement: CBV byte1.bit2 为预留位，必须填 0
    declared_phase: normal
    observability: observed
    clauses: ["§5.4.3"]
    when: { kind: bit_rule, byte: 1, bit: 2 }
    expect: { kind: is_zero }
    finding: NM_RESERVED_BIT_SET
    source_ref: §5.4.3

  - id: NM_RESERVED_B1_3
    requirement: CBV byte1.bit3 为预留位，必须填 0
    declared_phase: normal
    observability: observed
    clauses: ["§5.4.3"]
    when: { kind: bit_rule, byte: 1, bit: 3 }
    expect: { kind: is_zero }
    finding: NM_RESERVED_BIT_SET
    source_ref: §5.4.3

  - id: NM_RESERVED_B1_5
    requirement: CBV byte1.bit5 为预留位，必须填 0
    declared_phase: normal
    observability: observed
    clauses: ["§5.4.3"]
    when: { kind: bit_rule, byte: 1, bit: 5 }
    expect: { kind: is_zero }
    finding: NM_RESERVED_BIT_SET
    source_ref: §5.4.3

  - id: NM_RESERVED_B1_7
    requirement: CBV byte1.bit7 为预留位，必须填 0
    declared_phase: normal
    observability: observed
    clauses: ["§5.4.3"]
    when: { kind: bit_rule, byte: 1, bit: 7 }
    expect: { kind: is_zero }
    finding: NM_RESERVED_BIT_SET
    source_ref: §5.4.3

  # 吉利 §5.4.4：NMSts 位于 byte3.bit0，其 bit1–7 为预留位，必须填 0。
  - id: NM_RESERVED_B3_1
    requirement: NMSts 所在 byte3.bit1 为预留位，必须填 0
    declared_phase: normal
    observability: observed
    clauses: ["§5.4.4"]
    when: { kind: bit_rule, byte: 3, bit: 1 }
    expect: { kind: is_zero }
    finding: NM_RESERVED_BIT_SET
    source_ref: §5.4.4

  - id: NM_RESERVED_B3_2
    requirement: NMSts 所在 byte3.bit2 为预留位，必须填 0
    declared_phase: normal
    observability: observed
    clauses: ["§5.4.4"]
    when: { kind: bit_rule, byte: 3, bit: 2 }
    expect: { kind: is_zero }
    finding: NM_RESERVED_BIT_SET
    source_ref: §5.4.4

  - id: NM_RESERVED_B3_3
    requirement: NMSts 所在 byte3.bit3 为预留位，必须填 0
    declared_phase: normal
    observability: observed
    clauses: ["§5.4.4"]
    when: { kind: bit_rule, byte: 3, bit: 3 }
    expect: { kind: is_zero }
    finding: NM_RESERVED_BIT_SET
    source_ref: §5.4.4

  - id: NM_RESERVED_B3_4
    requirement: NMSts 所在 byte3.bit4 为预留位，必须填 0
    declared_phase: normal
    observability: observed
    clauses: ["§5.4.4"]
    when: { kind: bit_rule, byte: 3, bit: 4 }
    expect: { kind: is_zero }
    finding: NM_RESERVED_BIT_SET
    source_ref: §5.4.4

  - id: NM_RESERVED_B3_5
    requirement: NMSts 所在 byte3.bit5 为预留位，必须填 0
    declared_phase: normal
    observability: observed
    clauses: ["§5.4.4"]
    when: { kind: bit_rule, byte: 3, bit: 5 }
    expect: { kind: is_zero }
    finding: NM_RESERVED_BIT_SET
    source_ref: §5.4.4

  - id: NM_RESERVED_B3_6
    requirement: NMSts 所在 byte3.bit6 为预留位，必须填 0
    declared_phase: normal
    observability: observed
    clauses: ["§5.4.4"]
    when: { kind: bit_rule, byte: 3, bit: 6 }
    expect: { kind: is_zero }
    finding: NM_RESERVED_BIT_SET
    source_ref: §5.4.4

  - id: NM_RESERVED_B3_7
    requirement: NMSts 所在 byte3.bit7 为预留位，必须填 0
    declared_phase: normal
    observability: observed
    clauses: ["§5.4.4"]
    when: { kind: bit_rule, byte: 3, bit: 7 }
    expect: { kind: is_zero }
    finding: NM_RESERVED_BIT_SET
    source_ref: §5.4.4

  # 吉利 §5.4.1：报文 ID 区间。扩展帧 0x18FFFA00–0x18FFFAFF，标准帧 0x400–0x47F。
  - id: NM_LAYOUT_ID_EXT
    requirement: 扩展帧 NM 报文 ID 必须落在 0x18FFFA00–0x18FFFAFF
    declared_phase: normal
    observability: observed
    clauses: ["§5.4.1"]
    when:
      kind: layout_check
      min_id: "0x18FFFA00"
      max_id: "0x18FFFAFF"
      extended: true
    expect: { kind: equals }
    finding: NM_LAYOUT_VIOLATION
    source_ref: §5.4.1

  - id: NM_LAYOUT_ID_STD
    requirement: 标准帧 NM 报文 ID 必须落在 0x400–0x47F
    declared_phase: normal
    observability: observed
    clauses: ["§5.4.1"]
    when:
      kind: layout_check
      min_id: "0x400"
      max_id: "0x47F"
      extended: false
    expect: { kind: equals }
    finding: NM_LAYOUT_VIOLATION
    source_ref: §5.4.1
