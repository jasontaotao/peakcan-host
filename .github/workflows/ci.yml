name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight run for the same ref so PRs that get pushed
# to repeatedly don't burn the free-tier minutes budget.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # hil-core 是私有仓库 + 私有 NuGet 源（本地 feed D:\nuget-local），
      # CI runner 无法直接 restore。Checkout 源码到 workspace sibling
      # （GeneratorPluginLoaderTests 的 workspace-root 假定），Restore 前
      # 本地 pack 进 D:\nuget-local（与开发机 feed 路径一致，nuget.config
      # 无需改动）。token 用 fine-grained PAT（仅 peakcan-hil-core
      # Contents:read），存于 repo secret HIL_CORE_PAT。
      # 注意：此处刻意不指定 ref —— 打包的是 hil-core 的**默认分支**，因此该分支
      # 的版本必须等于 Directory.Packages.props 的 pin（下方 lockstep guard 会校验；
      # 不等就早失败，而不是留给 restore 报晦涩的找不到包）。
      # Fail with a readable message when the PAT secret is absent. Without this,
      # actions/checkout aborts the job with the opaque
      # "Input required and not supplied: token" — which is how CI sat 100% red
      # (60/60 runs, 2026-07-17 .. 2026-09-09) with nobody noticing, because that
      # error reads like a workflow bug rather than a missing repo secret.
      - name: Verify HIL_CORE_PAT secret is set
        env:
          HIL_CORE_PAT: ${{ secrets.HIL_CORE_PAT }}
        run: |
          if ([string]::IsNullOrEmpty($env:HIL_CORE_PAT)) {
            Write-Host "::error::The HIL_CORE_PAT repository secret is missing (gh secret list --repo jasontaotao/peakcan-host is empty)."
            Write-Host "Create a fine-grained PAT with Contents:read on jasontaotao/peakcan-hil-core, then run:"
            Write-Host "  gh secret set HIL_CORE_PAT --repo jasontaotao/peakcan-host"
            exit 1
          }
          Write-Host "HIL_CORE_PAT present."

      - name: Checkout hil-core (private, via PAT)
        uses: actions/checkout@v4
        with:
          repository: jasontaotao/peakcan-hil-core
          token: ${{ secrets.HIL_CORE_PAT }}
          path: peakcan-hil-core

      # Plan §19 specifies .NET 8.0.x but the project is built against
      # the .NET 10 SDK (verified in Task 1 - the dev box ``dotnet --list-sdks`` reports
      # the dev box reports only 10.0.300). Bump to 10.0.x so CI
      # matches the local toolchain.
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Pack hil-core from the sibling checkout into the local feed dir
      # the repo's nuget.config points at. CI runners have no D:\nuget-local
      # by default; creating it here keeps restore identical to the dev box.
      - name: Build + pack hil-core into local feed
        run: |
          dotnet build peakcan-hil-core/PeakCan.HIL.Core.slnx -c Release
          New-Item -ItemType Directory -Force -Path D:\nuget-local | Out-Null
          dotnet pack peakcan-hil-core/src/PeakCan.HIL.Core/PeakCan.HIL.Core.csproj -c Release -o D:\nuget-local --no-build

      # Lockstep guard. Directory.Packages.props pins an exact hil-core version and
      # the checkout above has NO `ref:`, so CI always packs hil-core's DEFAULT
      # branch. If that branch is not at the pinned version, the restore below dies
      # with an opaque "unable to find package PeakCan.HIL.Core x.y.z". Fail here
      # instead, naming the real cause and the release ordering that avoids it.
      - name: Verify packed hil-core version matches the pin
        run: |
          [xml]$props = Get-Content Directory.Packages.props
          $pin = ($props.Project.ItemGroup.PackageVersion |
                  Where-Object { $_.Include -eq 'PeakCan.HIL.Core' }).Version
          $expected = "D:\nuget-local\PeakCan.HIL.Core.$pin.nupkg"
          if (-not (Test-Path $expected)) {
            $packed = Get-ChildItem D:\nuget-local -Filter 'PeakCan.HIL.Core.*.nupkg' |
                      Sort-Object Name | Select-Object -Last 1
            $packedName = if ($packed) { $packed.Name } else { '(nothing packed)' }
            Write-Host "::error::hil-core lockstep broken - the host pins $pin but CI packed '$packedName' from hil-core's default branch."
            Write-Host "Land hil-core's release commits on its default branch BEFORE pushing the host commit that bumps the pin."
            Write-Host "Do not work around this by pinning a feature branch here; fix the release order."
            Write-Host "Missing expected artifact: $expected"
            exit 1
          }
          Write-Host "hil-core lockstep OK: packed $pin"

      # a2l-editor（PeakCan.ASAP2 包上游）同为私有仓库 + 本地 feed 分发
      # （spec §2 [H3] / 决策 D5 方案一）：CI runner 拿不到 D:\nuget-local，
      # 因此照抄 hil-core 模式——checkout 远端默认分支 → pack A2lEditor.Core
      # 入 D:\nuget-local → lockstep guard 早失败。不发 nuget.org。
      # token 用 fine-grained PAT（仅 jasontaotao/a2l-editor Contents:read），
      # 存于 repo secret A2L_EDITOR_PAT（hil-core 同款 fail-loud 检查）。
      # 注意：同样刻意不指定 ref —— 打包的是 a2l-editor 的**默认分支**，其
      # A2lEditor.Core.csproj 的版本必须等于 Directory.Packages.props 的
      # PeakCan.ASAP2 pin（下方 guard 校验；不等就早失败，不留给 restore
      # 报晦涩的找不到包）。
      - name: Verify A2L_EDITOR_PAT secret is set
        env:
          A2L_EDITOR_PAT: ${{ secrets.A2L_EDITOR_PAT }}
        run: |
          if ([string]::IsNullOrEmpty($env:A2L_EDITOR_PAT)) {
            Write-Host "::error::The A2L_EDITOR_PAT repository secret is missing."
            Write-Host "Create a fine-grained PAT with Contents:read on jasontaotao/a2l-editor, then run:"
            Write-Host "  gh secret set A2L_EDITOR_PAT --repo jasontaotao/peakcan-host"
            exit 1
          }
          Write-Host "A2L_EDITOR_PAT present."

      - name: Checkout a2l-editor (private, via PAT)
        uses: actions/checkout@v4
        with:
          repository: jasontaotao/a2l-editor
          token: ${{ secrets.A2L_EDITOR_PAT }}
          path: a2l-editor

      # 与 hil-core 的差异点：只 build/pack A2lEditor.Core 单项目（a2l-editor
      # sln 还含 WPF App/Cli 等与包无关的宿主工程，Core 是唯一发包产物）。
      # pack 落点与 hil-core 相同：D:\nuget-local（nuget.config 的 local 源）。
      # IncludeSymbols=true 会同产 .symbols.nupkg，guard 只认主包。
      - name: Build + pack A2lEditor.Core into local feed
        run: |
          dotnet build a2l-editor/src/A2lEditor.Core/A2lEditor.Core.csproj -c Release
          New-Item -ItemType Directory -Force -Path D:\nuget-local | Out-Null
          dotnet pack a2l-editor/src/A2lEditor.Core/A2lEditor.Core.csproj -c Release -o D:\nuget-local --no-build

      # Lockstep guard（hil-core lockstep 的 ASAP2 等价物）。a2l-editor checkout
      # 无 `ref:`，CI 永远 pack 其默认分支；若默认分支的包版本 ≠ host pin，
      # 下面的 restore 会死于晦涩的 "unable to find package PeakCan.ASAP2 x.y.z"。
      # 在这里早失败，指名真实原因与发布顺序（先落 a2l-editor 默认分支的
      # 版本提交，再 push host 的 pin bump commit）。
      - name: Verify packed ASAP2 version matches the pin
        run: |
          [xml]$props = Get-Content Directory.Packages.props
          $pin = ($props.Project.ItemGroup.PackageVersion |
                  Where-Object { $_.Include -eq 'PeakCan.ASAP2' }).Version
          $expected = "D:\nuget-local\PeakCan.ASAP2.$pin.nupkg"
          if (-not (Test-Path $expected)) {
            # 诊断查询排除 .symbols.nupkg，只报主包。
            $packed = Get-ChildItem D:\nuget-local -Filter 'PeakCan.ASAP2.*.nupkg' |
                      Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
                      Sort-Object Name | Select-Object -Last 1
            $packedName = if ($packed) { $packed.Name } else { '(nothing packed)' }
            Write-Host "::error::xcp-asap2 lockstep broken - the host pins $pin but CI packed '$packedName' from a2l-editor's default branch."
            Write-Host "Land a2l-editor's version commit on its default branch BEFORE pushing the host commit that bumps the PeakCan.ASAP2 pin."
            Write-Host "Do not work around this by pinning a feature branch here; fix the release order."
            Write-Host "Missing expected artifact: $expected"
            exit 1
          }
          # 残留防御（I-1）：期望主包存在后，feed 里仍不得残留任何非 pin 的
          # PeakCan.ASAP2 主包——自托管持久 runner / 未来 cache / 本地预演的
          # 旧版本残留会让 restore 解析到非 pin 版本而假绿，早失败。
          $stale = Get-ChildItem D:\nuget-local -Filter 'PeakCan.ASAP2.*.nupkg' |
                   Where-Object { $_.Name -ne "PeakCan.ASAP2.$pin.nupkg" -and
                                  $_.Name -notlike '*.symbols.nupkg' }
          if ($stale) {
            Write-Host "::error::xcp-asap2 lockstep broken - stale PeakCan.ASAP2 main package(s) in D:\nuget-local: $(($stale | ForEach-Object Name) -join ', ') (pin is $pin)."
            Write-Host "Remove the stale main package(s) so restore cannot resolve a version other than the pin."
            exit 1
          }
          Write-Host "xcp-asap2 lockstep OK: packed $pin"

      - name: Restore
        run: dotnet restore PeakCan.Host.slnx

      - name: Build (Release)
        run: dotnet build PeakCan.Host.slnx -c Release --no-restore

      # Test + coverage. coverlet.collector (a PackageReference in every test
      # project) is driven by --collect and emits
      # TestResults/<guid>/coverage.cobertura.xml per test project.
      # NOTE: there are NO per-project <Threshold> properties — coverlet.collector
      # does not support them (the old comment here claiming Core 95 % / Infra 80 %
      # / App 70 % gates was false). The explicit "Enforce coverage floor" step
      # below is the real gate.
      #
      # --filter "Performance!=true" excludes [Trait("Performance","true")]
      # tests (e.g. AscParserTests.Parse_LargeFile_Performance). Those
      # are local-dev latency signals, not functional gates — their
      # tight ms budgets flake under CI VM CPU contention (parse is
      # correct, just slower than the budget). Functional regression
      # must not be blocked by an environment-sensitive timing assertion.
      # To run the excluded timing tests locally:
      #   dotnet test --filter "Performance=true"
      #
      # FullyQualifiedName!~Manual excludes [Trait("Manual","true")] tests
      # (BlfParserManualTests / BlfRealVectorReproTests) whose local-only
      # fixtures make them no-op vacuously — matching what the test doc-comments
      # already promise.
      - name: Test + Coverage
        run: dotnet test PeakCan.Host.slnx -c Release --no-build --verbosity normal --filter "Performance!=true&FullyQualifiedName!~Manual" --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      # Real coverage gate: aggregate the coverlet.collector cobertura reports
      # and fail the build if overall line coverage drops below the floor.
      # (Raise the floor as the suite improves; it is set below the current
      # measured baseline so it catches regressions without being brittle.)
      - name: Enforce coverage floor
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Recurse -Filter coverage.cobertura.xml)
          if ($files.Count -eq 0) { throw "No coverage reports were produced." }
          # Every test project's report covers the assemblies it references, so the
          # same source line appears in several reports. Union the hits per
          # (assembly, file, line) before scoring — summing report totals would
          # double-count and understate coverage badly.
          $cov = @{}
          foreach ($f in $files) {
            [xml]$x = Get-Content -LiteralPath $f.FullName
            foreach ($p in $x.coverage.packages.package) {
              $n = [string]$p.name
              foreach ($cl in $p.classes.class) {
                $fn = [string]$cl.filename
                foreach ($l in $cl.lines.line) {
                  $key = "$n|$fn|$($l.number)"
                  $h = [int]$l.hits
                  if (-not $cov.ContainsKey($key) -or $h -gt $cov[$key]) { $cov[$key] = $h }
                }
              }
            }
          }
          $pattern = '^PeakCan\.(Host|Host\.Core|Host\.Infrastructure|Host\.Mobile\.Core|Security)$'
          $agg = @{}
          foreach ($k in $cov.Keys) {
            $n = $k.Split('|')[0]
            if ($n -notmatch $pattern) { continue }
            if (-not $agg.ContainsKey($n)) { $agg[$n] = @{ Covered = 0; Valid = 0 } }
            $agg[$n].Valid++
            if ($cov[$k] -gt 0) { $agg[$n].Covered++ }
          }
          if ($agg.Count -eq 0) { throw "No in-repo product assemblies were found in the coverage reports." }
          $covered = 0; $total = 0
          foreach ($n in ($agg.Keys | Sort-Object)) {
            $v = $agg[$n]
            $rate = [math]::Round(100.0 * $v.Covered / [math]::Max($v.Valid, 1), 1)
            Write-Host ("  {0,-32} {1,6}%  ({2}/{3})" -f $n, $rate, $v.Covered, $v.Valid)
            $covered += $v.Covered; $total += $v.Valid
          }
          $overall = [math]::Round(100.0 * $covered / [math]::Max($total, 1), 2)
          Write-Host "In-repo product line coverage: $overall% ($covered/$total)"
          # Floor is set just below the measured baseline (2026-09-15: 76.6%).
          $floor = 70.0
          if ($overall -lt $floor) { throw "Product line coverage $overall% is below the $floor% floor." }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/TestResults/**/coverage.cobertura.xml'

