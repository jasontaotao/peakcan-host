<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <filter id="wshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1F2933" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="780" fill="#EEF1F4"/>

  <!-- dimmed background window hint -->
  <rect x="20" y="18" width="1160" height="744" rx="10" fill="#FFFFFF" opacity="0.55"/>
  <rect x="20" y="18" width="1160" height="36" rx="10" fill="#F7F9FA" opacity="0.7"/>
  <text x="600" y="41" text-anchor="middle" font-size="13" fill="#9AA6B2">PeakCan Host — Trace Viewer</text>
  <rect x="36" y="106" width="700" height="620" rx="8" fill="#FBFCFD" opacity="0.6" stroke="#D5DBE1"/>
  <rect x="754" y="106" width="410" height="620" rx="8" fill="#FBFCFD" opacity="0.6" stroke="#D5DBE1"/>

  <!-- dialog -->
  <rect x="120" y="60" width="960" height="660" rx="10" fill="#FFFFFF" stroke="#C9D1DA" filter="url(#wshadow)"/>
  <rect x="120" y="60" width="960" height="46" rx="10" fill="#F7F9FA"/>
  <rect x="120" y="96" width="960" height="10" fill="#F7F9FA"/>
  <text x="144" y="89" font-size="14" font-weight="600" fill="#33414F">补全 NM 分析输入</text>
  <text x="1056" y="89" text-anchor="end" font-size="11" fill="#8794A2">DBC 缺项 3 项 · 已就绪 2 项</text>

  <!-- left list -->
  <rect x="140" y="120" width="270" height="520" rx="6" fill="#FBFCFD" stroke="#D5DBE1"/>
  <text x="154" y="142" font-size="12" font-weight="600" fill="#33414F">分析能力</text>

  <g font-size="10.5">
    <rect x="150" y="154" width="248" height="56" rx="5" fill="#FFFFFF" stroke="#D5DBE1"/>
    <text x="162" y="173" font-size="11" fill="#33414F" font-weight="600">识别 NM 报文</text>
    <text x="162" y="189" font-size="9.5" fill="#8794A2">DBC 未标记 · 需确认</text>
    <rect x="326" y="162" width="62" height="20" rx="10" fill="#FDF0E6" stroke="#F2D6BF"/>
    <text x="357" y="176" text-anchor="middle" font-size="9" fill="#B4692B">待确认</text>

    <rect x="150" y="216" width="248" height="56" rx="5" fill="#FFFFFF" stroke="#D5DBE1"/>
    <text x="162" y="235" font-size="11" fill="#33414F" font-weight="600">周期</text>
    <text x="162" y="251" font-size="9.5" fill="#8794A2">NmAsrCanMsgCycleTime 500ms</text>
    <rect x="326" y="224" width="62" height="20" rx="10" fill="#EAF6EE" stroke="#C9E6D3"/>
    <text x="357" y="238" text-anchor="middle" font-size="9" fill="#2E8B57">已就绪</text>

    <rect x="150" y="278" width="248" height="56" rx="5" fill="#FFFFFF" stroke="#D5DBE1"/>
    <text x="162" y="297" font-size="11" fill="#33414F" font-weight="600">超时</text>
    <text x="162" y="313" font-size="9.5" fill="#8794A2">NmAsrTimeoutTime 2000ms</text>
    <rect x="326" y="286" width="62" height="20" rx="10" fill="#EAF6EE" stroke="#C9E6D3"/>
    <text x="357" y="300" text-anchor="middle" font-size="9" fill="#2E8B57">已就绪</text>

    <rect x="150" y="340" width="248" height="56" rx="5" fill="#EAF1FB" stroke="#2F6FD0" stroke-width="1.5"/>
    <text x="162" y="359" font-size="11" fill="#1F4E8C" font-weight="600">NID 字节</text>
    <text x="162" y="375" font-size="9.5" fill="#5B6B7B">建议 byte0 · 待确认</text>
    <rect x="326" y="348" width="62" height="20" rx="10" fill="#2F6FD0"/>
    <text x="357" y="362" text-anchor="middle" font-size="9" fill="#FFFFFF">编辑中</text>

    <rect x="150" y="402" width="248" height="56" rx="5" fill="#FFFFFF" stroke="#D5DBE1"/>
    <text x="162" y="421" font-size="11" fill="#33414F" font-weight="600">CBV 字节 / 位义</text>
    <text x="162" y="437" font-size="9.5" fill="#8794A2">建议 byte1；位义未填</text>
    <rect x="326" y="410" width="62" height="20" rx="10" fill="#FDF0E6" stroke="#F2D6BF"/>
    <text x="357" y="424" text-anchor="middle" font-size="9" fill="#B4692B">待确认</text>

    <rect x="150" y="464" width="248" height="56" rx="5" fill="#FFFFFF" stroke="#D5DBE1"/>
    <text x="162" y="483" font-size="11" fill="#33414F" font-weight="600">PN / 用户数据</text>
    <text x="162" y="499" font-size="9.5" fill="#8794A2">未配置 · 可跳过</text>
    <rect x="326" y="472" width="62" height="20" rx="10" fill="#F2F4F6" stroke="#D5DBE1"/>
    <text x="357" y="486" text-anchor="middle" font-size="9" fill="#8794A2">可跳过</text>

    <rect x="150" y="526" width="248" height="56" rx="5" fill="#FBFCFD" stroke="#E5E9ED"/>
    <text x="162" y="545" font-size="11" fill="#8794A2" font-weight="600">企标规则</text>
    <text x="162" y="561" font-size="9.5" fill="#9AA6B2">M2 · 需要企标包</text>
    <rect x="326" y="534" width="62" height="20" rx="10" fill="#F2F4F6" stroke="#E5E9ED"/>
    <text x="357" y="548" text-anchor="middle" font-size="9" fill="#9AA6B2">M2</text>
  </g>
  <text x="154" y="622" font-size="9.5" fill="#9AA6B2">只补当前问题需要的项；不用一次填全。</text>

  <!-- center sample preview -->
  <rect x="426" y="120" width="380" height="330" rx="6" fill="#FBFCFD" stroke="#D5DBE1"/>
  <text x="440" y="142" font-size="12" font-weight="600" fill="#33414F">样本预览（2 帧）</text>
  <text x="792" y="142" text-anchor="end" font-size="9.5" fill="#8794A2">点击字节可设为 NID / CBV</text>

  <g font-size="10" font-family="Consolas, monospace">
    <text x="440" y="176" fill="#5B6B7B">0x18FFFAF4</text>
    <rect x="520" y="162" width="26" height="20" rx="3" fill="#2F6FD0"/>
    <text x="533" y="176" text-anchor="middle" fill="#FFFFFF">F4</text>
    <rect x="550" y="162" width="26" height="20" rx="3" fill="#E0B34F"/>
    <text x="563" y="176" text-anchor="middle" fill="#FFFFFF">00</text>
    <g fill="#33414F">
      <text x="584" y="176">00</text><text x="614" y="176">00</text><text x="644" y="176">00</text>
      <text x="674" y="176">00</text><text x="704" y="176">00</text><text x="734" y="176">00</text>
    </g>
  </g>
  <g font-size="10" font-family="Consolas, monospace">
    <text x="440" y="210" fill="#5B6B7B">0x18FFFAF4</text>
    <rect x="520" y="196" width="26" height="20" rx="3" fill="#2F6FD0"/>
    <text x="533" y="210" text-anchor="middle" fill="#FFFFFF">F4</text>
    <rect x="550" y="196" width="26" height="20" rx="3" fill="#E0B34F"/>
    <text x="563" y="210" text-anchor="middle" fill="#FFFFFF">08</text>
    <g fill="#33414F">
      <text x="584" y="210">00</text><text x="614" y="210">00</text><text x="644" y="210">00</text>
      <text x="674" y="210">00</text><text x="704" y="210">00</text><text x="734" y="210">00</text>
    </g>
  </g>
  <text x="440" y="240" font-size="9.5" fill="#2F6FD0">byte0 = 0xF4（1200/1200 帧恒定，等于 CAN ID 低字节）</text>
  <text x="440" y="258" font-size="9.5" fill="#B4692B">byte1 = 0x00 → 0x08（bit3 翻转 2 次）</text>

  <!-- axis/decoded preview -->
  <rect x="440" y="272" width="352" height="76" rx="5" fill="#FFFFFF" stroke="#E5E9ED"/>
  <text x="452" y="290" font-size="10" fill="#8794A2">按当前输入解码</text>
  <text x="452" y="308" font-size="10.5" fill="#33414F">NID = byte0 → 0xF4</text>
  <text x="452" y="324" font-size="10.5" fill="#33414F">CBV = byte1 → 0x08（bit3=1，位义待填）</text>
  <text x="452" y="340" font-size="10.5" fill="#33414F">用户数据：byte2..7 全零 → 建议 length 0</text>

  <rect x="440" y="360" width="352" height="76" rx="5" fill="#F7F9FA" stroke="#E5E9ED"/>
  <text x="452" y="378" font-size="10" fill="#8794A2">为什么需要</text>
  <text x="452" y="396" font-size="10" fill="#5B6B7B">不知道 NID 在哪个字节，就无法判断发送者与站地址/ID 是否一致；</text>
  <text x="452" y="412" font-size="10" fill="#5B6B7B">不填 CBV 位义，只能报“位翻转”，不能说是主动唤醒/PNI。</text>

  <!-- right editor -->
  <rect x="816" y="120" width="244" height="330" rx="6" fill="#FBFCFD" stroke="#D5DBE1"/>
  <text x="830" y="142" font-size="12" font-weight="600" fill="#33414F">NID 字节</text>
  <text x="830" y="166" font-size="10" fill="#8794A2">NID 位置</text>
  <g font-size="10">
    <rect x="830" y="174" width="64" height="24" rx="4" fill="#2F6FD0"/>
    <text x="862" y="190" text-anchor="middle" fill="#FFFFFF">byte0</text>
    <rect x="900" y="174" width="64" height="24" rx="4" fill="#FFFFFF" stroke="#C9D1DA"/>
    <text x="932" y="190" text-anchor="middle" fill="#5B6B7B">byte1</text>
    <rect x="970" y="174" width="76" height="24" rx="4" fill="#FFFFFF" stroke="#C9D1DA"/>
    <text x="1008" y="190" text-anchor="middle" fill="#5B6B7B">自定义</text>
  </g>

  <rect x="830" y="212" width="216" height="86" rx="5" fill="#EAF6EE" stroke="#C9E6D3"/>
  <text x="842" y="230" font-size="10" fill="#2E8B57" font-weight="600">建议：byte0</text>
  <text x="842" y="248" font-size="9.5" fill="#5B6B7B">96% 帧恒为 0xF4，且等于 CAN ID 低字节</text>
  <text x="842" y="264" font-size="9.5" fill="#5B6B7B">Top-2 候选：byte0 (0xF4) / byte1 (0x00/0x08)</text>
  <rect x="842" y="272" width="86" height="20" rx="4" fill="#2E8B57"/>
  <text x="885" y="286" text-anchor="middle" font-size="9" fill="#FFFFFF">采用建议</text>

  <text x="830" y="326" font-size="10" fill="#8794A2">期望映射</text>
  <g font-size="10">
    <rect x="830" y="334" width="216" height="24" rx="4" fill="#FFFFFF" stroke="#C9D1DA"/>
    <text x="842" y="350" fill="#5B6B7B">CAN ID 低字节 = NID（low-byte SA）▾</text>
  </g>
  <text x="830" y="380" font-size="9.5" fill="#9AA6B2">站地址：BMS 0xF4 / PMS 0x27（来自 DBC）</text>
  <text x="830" y="398" font-size="9.5" fill="#9AA6B2">冲突：ECUC CanNmNodeId=0x0 → 保留待确认</text>

  <rect x="830" y="410" width="216" height="26" rx="4" fill="#FFFFFF" stroke="#C9D1DA"/>
  <text x="842" y="427" font-size="10" fill="#8794A2">备注（可选）</text>

  <!-- bottom trial -->
  <rect x="426" y="466" width="634" height="120" rx="6" fill="#FFFFFF" stroke="#D5DBE1"/>
  <text x="440" y="486" font-size="11" font-weight="600" fill="#33414F">试算当前窗口</text>
  <g font-size="10" fill="#5B6B7B">
    <text x="440" y="508">识别 NM：0x18FFFAF4 / 0x18FFFA27</text>
    <text x="440" y="526">周期中位：500.2ms（配置 500ms）· 偏差 0.3%</text>
    <text x="440" y="544">NID：0xF4 1200/1200（发送者 BMS）· 无变化</text>
    <text x="440" y="562">CBV：byte1 bit3 翻转 2 次（位义未填，不判定）</text>
    <text x="700" y="508">空档：1 次 2.2s（&gt; 2000ms）</text>
    <text x="700" y="526">观察突发：首 5 帧 / 中位 50ms</text>
    <text x="700" y="544">用户数据：byte2..7 全零</text>
  </g>

  <rect x="426" y="596" width="634" height="44" rx="5" fill="#F7F9FA" stroke="#E5E9ED"/>
  <text x="440" y="614" font-size="9.5" fill="#8794A2">保存位置</text>
  <text x="440" y="630" font-size="10" fill="#33414F">BMS_Matrix_V2.1.nmprofile.json（DBC 同目录）· 记录 DBC hash</text>
  <text x="1046" y="614" text-anchor="end" font-size="9.5" fill="#9AA6B2">DBC 重生成不覆盖</text>

  <!-- footer buttons -->
  <rect x="426" y="654" width="120" height="34" rx="6" fill="#2F6FD0"/>
  <text x="486" y="676" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">保存到项目</text>
  <rect x="556" y="654" width="110" height="34" rx="6" fill="#FFFFFF" stroke="#C9D1DA"/>
  <text x="611" y="676" text-anchor="middle" font-size="11" fill="#5B6B7B">取消</text>
  <text x="1046" y="676" text-anchor="end" font-size="9.5" fill="#8794A2">保存后工具自动重算能力</text>

  <!-- callouts -->
  <g font-size="10">
    <circle cx="418" cy="132" r="9" fill="#2F6FD0"/><text x="418" y="136" text-anchor="middle" fill="#FFFFFF">1</text>
    <circle cx="418" cy="300" r="9" fill="#2F6FD0"/><text x="418" y="304" text-anchor="middle" fill="#FFFFFF">2</text>
    <circle cx="808" cy="132" r="9" fill="#2F6FD0"/><text x="808" y="136" text-anchor="middle" fill="#FFFFFF">3</text>
    <circle cx="418" cy="478" r="9" fill="#2F6FD0"/><text x="418" y="482" text-anchor="middle" fill="#FFFFFF">4</text>
  </g>
  <text x="140" y="704" font-size="10" fill="#5B6B7B">① 缺项列表（只列当前需要的）　② hex 样本预览，点字节即选　③ 建议值 + 期望映射 + 为什么需要　④ 先试算，再保存 sidecar</text>
  <text x="1060" y="704" text-anchor="end" font-size="9.5" fill="#9AA6B2">线框示意，非最终视觉</text>
</svg>
